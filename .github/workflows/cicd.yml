name: CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Cache Gradle packages
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Docker layers
        uses: actions/cache@v4.2.3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and Push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROD_IMAGE_NAME }}:latest
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Notify Discord (CI/CD - Build) - Failure Only
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"   # 여기서는 항상 failure
          COLOR=15158332
          TITLE="❌ Build & Push Failed"

          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"
          SHA7="$(echo "${{ github.sha }}" | cut -c1-7)"

          payload=$(cat <<EOF
          {
            "username": "GitHub Actions",
            "embeds": [
              {
                "title": "${TITLE}",
                "url": "${RUN_URL}",
                "color": ${COLOR},
                "fields": [
                  { "name": "Repository", "value": "${REPO}", "inline": true },
                  { "name": "Branch", "value": "${BRANCH}", "inline": true },
                  { "name": "Commit", "value": "${SHA7}", "inline": true },
                  { "name": "Status", "value": "${STATUS}", "inline": true },
                  { "name": "Logs", "value": "[Open Actions Run](${RUN_URL})", "inline": false }
                ]
              }
            ]
          }
          EOF
          )

          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
  
  

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH to Server and Deploy
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_KEY }}
          script: |
            cd /home/ec2-user/alter
            echo "${{ secrets.PROD_ENV }}" > ./env/prodEnv
            ./deploy.sh
            docker image prune -f

      - name: Notify Discord (CI/CD - Deploy)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Deploy Success"
          else
            COLOR=15158332
            TITLE="❌ Deploy Failed"
          fi

          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHA7="$(echo "$SHA" | cut -c1-7)"

          payload=$(cat <<EOF
          {
            "username": "GitHub Actions",
            "embeds": [
              {
                "title": "${TITLE}",
                "url": "${RUN_URL}",
                "color": ${COLOR},
                "fields": [
                  { "name": "Repository", "value": "${REPO}", "inline": true },
                  { "name": "Branch", "value": "${BRANCH}", "inline": true },
                  { "name": "Commit", "value": "${SHA7}", "inline": true },
                  { "name": "Status", "value": "${STATUS}", "inline": true },
                  { "name": "Logs", "value": "[Open Actions Run](${RUN_URL})", "inline": false }
                ]
              }
            ]
          }
          EOF
          )

          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"

