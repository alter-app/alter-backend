server:
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
spring:
  application:
    name: alter
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    out-of-order: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL}
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
kakao:
  client_id: ${KAKAO_CLIENT_ID}
  redirect_uri: ${KAKAO_REDIRECT_URI}
apple:
  team_id: ${APPLE_TEAM_ID}
  login_key: ${APPLE_LOGIN_KEY}
  private_key: ${APPLE_PRIVATE_KEY}
  client_id: ${APPLE_CLIENT_ID}
  service_id: ${APPLE_SERVICE_ID}
  redirect_uri: ${APPLE_REDIRECT_URI}
jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
  refresh-token:
    expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME}
springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /api-docs
alter:
  security:
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS}
    allowed-methods: ${ALLOWED_METHODS}
    allowed-headers: ${ALLOWED_HEADERS}
    exposed-headers: ${EXPOSED_HEADERS}
    allowed-pattern: ${ALLOWED_PATTERN}
    permit-all-urls: ${PERMIT_ALL_URLS}
  email:
    from: ${SES_FROM_EMAIL}
    code-ttl-seconds: ${EMAIL_CODE_TTL_SECONDS}
    verified-ttl-seconds: ${EMAIL_VERIFIED_TTL_SECONDS}
    cooldown-seconds: ${EMAIL_COOLDOWN_SECONDS}
    max-attempts: ${EMAIL_MAX_ATTEMPTS}
firebase:
  fcm:
    project-id: ${FIREBASE_PROJECT_ID}
    service-account-key: ${FIREBASE_SERVICE_ACCOUNT_KEY}
sgis:
  service-id: ${SGIS_SERVICE_ID}
  service-secret: ${SGIS_SERVICE_SECRET}
aws:
  region: ${AWS_REGION}
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    region: ${AWS_S3_REGION}
    public-bucket: ${AWS_S3_PUBLIC_BUCKET}
    private-bucket: ${AWS_S3_PRIVATE_BUCKET}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES}
chat:
  broker:
    relay:
      enabled: ${CHAT_BROKER_RELAY_ENABLED:false}
      host: ${RABBITMQ_RELAY_HOST:localhost}
      port: ${RABBITMQ_RELAY_PORT:61613}
      client-login: ${RABBITMQ_RELAY_USER:guest}
      client-passcode: ${RABBITMQ_RELAY_PASS:guest}
